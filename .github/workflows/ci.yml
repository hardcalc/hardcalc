name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Typst reports (feature typst)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --features typst
          cargo clippy --all-targets --features typst -- -D warnings
      - name: LibreOffice extension
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s libreoffice/tests
